name: 'Deploy check by The Deployer'
description: 'Will this repository deploy? What it runs, what is missing (with the fix), committed secrets, and the monthly cost in your own cloud.'
author: 'The Deployer'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  path:
    description: 'The repository folder to check. Only committed files are sent (a git archive of HEAD).'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the job when: needs-work, almost (almost or needs work), secrets, or never.'
    required: false
    default: 'never'
  api:
    description: 'The check service address. Leave empty for https://app.thedploy.com/api/v1.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Deploy check
      shell: bash
      env:
        DEPLOY_CHECK_PATH: ${{ inputs.path }}
        DEPLOY_CHECK_FAIL_ON: ${{ inputs.fail-on }}
        DEPLOY_CHECK_API: ${{ inputs.api }}
      run: node "$GITHUB_ACTION_PATH/index.mjs" "$DEPLOY_CHECK_PATH" --fail-on "$DEPLOY_CHECK_FAIL_ON" --summary "$GITHUB_STEP_SUMMARY"
